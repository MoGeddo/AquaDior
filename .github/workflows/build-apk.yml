# ==============================================================
#  🏗️ بناء APK للتليفون — من غير أي برامج على جهازك
#  ------------------------------------------------------------
#  الطريقة:
#   1) GitHub → تبويب Actions → Build APK → Run workflow
#   2) استنى 5–10 دقايق
#   3) نزّل الـ APK من: Releases → "أحدث نسخة APK"
#      لينك مباشر (يفتح من تليفونك):
#      https://github.com/MoGeddo/AquaDior/releases/download/apk-latest/AquaDior.apk
#
#  ملاحظة: لا ينشر الـ workflow نسخة Demo أو بيانات تجريبية.
#  يجب ضبط متغيري Supabase قبل تشغيله:
#      VITE_SUPABASE_URL
#      VITE_SUPABASE_ANON_KEY
#  (المفتاح العام anon مخصص للعميل؛ الحماية الفعلية عبر RLS.)
# ==============================================================
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths-ignore:
      - "**.md"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1) فحص + بناء نسخة الويب ----------
  web:
    name: 🧪 فحص وبناء الويب
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تنزيل المكتبات
        run: npm ci

      - name: فحص قواعد الكود
        run: npm run lint

      - name: 🧪 اختبار التشغيل (Smoke Test)
        run: npm run test:smoke

      - name: بناء الويب
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${VITE_SUPABASE_URL:-}" || -z "${VITE_SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::لن يُبنى APK ببيانات وهمية. اضبط VITE_SUPABASE_URL وVITE_SUPABASE_ANON_KEY معًا."
            exit 1
          fi
          export VITE_DEMO_MODE=0
          echo "بناء إصدار تشغيل حقيقي مرتبط بمشروع Supabase المضبوط."

          npm run build
          if [ ! -f dist/index.html ]; then
            echo "::error::مفيش dist/index.html بعد البناء"
            exit 1
          fi
          echo "✅ الويب جاهز: $(find dist -type f | wc -l) ملف"
          ls -la dist/ | head

      - name: رفع ناتج البناء
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  # ---------- 2) لفّ نسخة الويب في APK ----------
  apk:
    name: 📱 بناء APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تهيئة Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: تنزيل نسخة الويب المبنية
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: تنزيل المكتبات + Capacitor
        run: |
          npm ci
          npm i --no-save @capacitor/core@^7 @capacitor/android@^7 @capacitor/cli@^7 @capacitor/assets@^3
          npx cap --version

      - name: تهيئة مشروع أندرويد وأيقونة التطبيق
        run: |
          npx cap add android
          npx cap sync android
          npx @capacitor/assets generate --android --iconBackgroundColor '#08090b' --splashBackgroundColor '#08090b'

      - name: تجهيز Android SDK
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK" ]; then
            yes | "$SDK" --licenses > /dev/null 2>&1 || true
            "$SDK" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: استخدام مرآة تنزيل Gradle المباشرة
        run: |
          set -euo pipefail
          sed -i 's#services\.gradle\.org/distributions#downloads.gradle.org/distributions#' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: 🔑 فحص مفتاح توقيع إصدار موثوق
        id: release-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEYSTORE_ALIAS" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::سيُبنى APK تجريبي قابل للتثبيت فقط؛ إصدار APK موقّع يحتاج أسرار keystore."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" > /dev/null
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: ✍️ تفعيل توقيع الإصدار في Gradle
        if: steps.release-signing.outputs.ready == 'true'
        run: |
          cat >> android/app/build.gradle <<'EOF'

          // ==== توقيع تلقائي (بيتضاف وقت البناء على GitHub) ====
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_FILE") ?: "${rootProject.projectDir}/../release.keystore")
                      storePassword System.getenv("KS_PASS")
                      keyAlias System.getenv("KS_ALIAS")
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          echo "--- آخر 25 سطر من build.gradle ---"
          tail -25 android/app/build.gradle

      - name: 📱 بناء APK
        env:
          KS_FILE: ${{ github.workspace }}/release.keystore
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          HAS_RELEASE_SIGNING: ${{ steps.release-signing.outputs.ready }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          if [[ "$HAS_RELEASE_SIGNING" == "true" ]]; then
            ./gradlew --no-daemon assembleRelease
          else
            echo "تم تخطي إصدار APK الموقّع؛ لا توجد أسرار keystore."
          fi

      - name: تجميع الملفات
        run: |
          set -euo pipefail
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/AquaDior-debug.apk
          if [ -s android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk/AquaDior.apk
          fi
          ls -lh apk/
          test -s apk/AquaDior-debug.apk

      - name: 🔍 التحقق من محتوى الـ APK
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          APK=apk/AquaDior-debug.apk
          test -x "$BT/aapt2"
          test -x "$BT/apksigner"
          echo "===== بيانات التطبيق ====="
          "$BT/aapt2" dump badging "$APK" | head -6
          echo "===== ملفات الويب داخل الـ APK ====="
          unzip -l "$APK" | grep -E "assets/public/(index\.html|assets/)"
          echo "===== التحقق من توقيع APK المتاح ====="
          "$BT/apksigner" verify --print-certs "$APK" | head -8
          if [ -s apk/AquaDior.apk ]; then
            "$BT/apksigner" verify --print-certs apk/AquaDior.apk | head -8
          fi
          echo "===== الحجم ====="
          ls -lh apk/

      - name: رفع الـ APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/*.apk
          retention-days: 30

      - name: 📦 نشره على صفحة Releases
        if: github.ref == 'refs/heads/main' && steps.release-signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "📱 أحدث نسخة APK — تطبيق العمال"
          body: |
            ### نزّل وثبّت على الأندرويد

            1. نزّل الملف **AquaDior.apk**
            2. افتحه → لو ظهر تحذير اختر **"السماح من هذا المصدر"**
            3. سجّل الدخول بحساب Supabase الخاص بمشروع النشر.

            لا يسمح workflow بإصدار APK دون إعدادات Supabase؛ لا تُضمّن بيانات Demo في إصدار التشغيل الحقيقي.

            > `AquaDior-debug.apk` نسخة تصحيح منفصلة.
          files: apk/*.apk
          prerelease: true
          make_latest: false
